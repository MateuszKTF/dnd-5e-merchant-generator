name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the whole suite be launched by hand from the Actions tab or
  # `gh workflow run CI`, without inventing a commit to hang it on. Useful when
  # a run needs repeating against unchanged code — re-running an old run checks
  # out that run's SHA, so it cannot show current main as green.
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Action majors are pinned and bumped deliberately. v4 across the board
      # was being force-run on Node 24 because it targets the deprecated
      # Node 20 runtime; these majors target 24 natively. None of the inputs
      # used below changed across the bump.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Follow the repo's pin rather than drifting to whatever 22.x is
          # newest. jsdom 30 floors at ^22.22.2, so "22" resolving to an older
          # patch would fail `npm ci` on engines with no obvious cause.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro sync
      # Type errors are invisible to the three steps below: Vitest transpiles
      # without type-checking and `astro build` does not type-check `.ts`. The
      # entity contract in src/lib/merchant.test.ts is a compile-time assertion,
      # so without this step a UI type could gain a field, be dropped silently
      # on save, and CI would stay green.
      - run: npm run typecheck
      # Runs both projects (node + dom). `--coverage` reports only — there is no
      # threshold and this step does not fail on a low number. Its job is to make
      # the untested surface visible in the log, which is the gap lessons L-05
      # recorded: a green counter answering a different question than the one
      # being asked. The gate comes later, with §3 Phase 4 of the test plan.
      - run: npm test -- --coverage
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # E2E runs last on purpose: it is by far the most expensive step, so every
      # cheaper gate above should have a chance to fail first. Nothing below
      # depends on the build output — Playwright starts its own dev server — but
      # spending three minutes on browsers to then fail on a broken build is
      # waste, not thoroughness.
      #
      # Keyed on package-lock.json so the cache is invalidated exactly when the
      # @playwright/test version moves. A miss only costs the download.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # `--with-deps` installs the system libraries Chromium needs on a bare
      # runner; it is cheap and runs whether or not the browser itself was
      # cached. Chromium only — the suite declares no other browser, and
      # installing three would triple the slowest step for no extra signal.
      - run: npx playwright install --with-deps chromium
      # The config sets `forbidOnly`, one retry and a single worker when CI is
      # set, and starts `npm run dev` itself. GitHub Actions exports CI=true.
      - run: npm run test:e2e

      # The HTML report is the only way to see *why* a browser test failed after
      # the fact — it carries the trace recorded on the retry. Without this a
      # red E2E step is a stack trace and nothing else.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
