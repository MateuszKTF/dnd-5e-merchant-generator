name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      # Type errors are invisible to the three steps below: Vitest transpiles
      # without type-checking and `astro build` does not type-check `.ts`. The
      # entity contract in src/lib/merchant.test.ts is a compile-time assertion,
      # so without this step a UI type could gain a field, be dropped silently
      # on save, and CI would stay green.
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
